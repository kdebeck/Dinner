<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#8b7356"><meta name="apple-mobile-web-app-capable" content="yes"><title>Dinner</title><link rel="apple-touch-icon" href="apple-touch-icon.png"><style>
:root{--cream:#f5efe5;--paper:#fffaf3;--brown:#6f5a43;--sage:#75806b;--ink:#342d27;--muted:#746d65;--line:rgba(111,90,67,.14);--shadow:0 10px 26px rgba(77,62,45,.10)}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","Avenir Next",system-ui,sans-serif}.shell{max-width:720px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom))}
.brand{font-family:Georgia,serif;font-size:24px;color:var(--brown);margin:4px 0 16px}.hero{background:linear-gradient(145deg,#eadfce,#f7efe3 55%,#fffaf3);border:1px solid var(--line);border-radius:30px;padding:24px;box-shadow:var(--shadow)}.kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--sage);font-weight:900}
h1,h2{font-family:Georgia,serif;color:var(--brown);font-weight:500}h1{font-size:38px;line-height:1.02;margin:9px 0 8px}h2{font-size:25px;margin:0}.sub{color:var(--muted);font-size:14px;line-height:1.45}.section{margin-top:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile,.card{background:rgba(255,250,243,.96);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}.tile{padding:16px;text-align:left;min-height:116px}.tile .ico{font-size:24px}.tile strong{display:block;color:var(--brown);font-size:16px;margin-top:9px}.tile small{display:block;color:var(--muted);margin-top:4px;line-height:1.3}.card{padding:17px;margin:10px 0}.btn{border:0;border-radius:15px;padding:12px 15px;font:inherit;font-weight:800}.primary{background:var(--brown);color:white}.secondary{background:#eee5d8;color:var(--brown);border:1px solid var(--line)}.wide{width:100%}.bottom{position:fixed;z-index:30;bottom:0;left:0;right:0;max-width:720px;margin:auto;display:flex;background:rgba(250,247,241,.97);backdrop-filter:blur(14px);border-top:1px solid #ded5c8;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}.bottom button{flex:1;border:0;background:none;color:#837a70;padding:5px 0;font-size:18px}.bottom span{display:block;font-size:10px}.bottom .active{color:var(--brown);font-weight:900}.pills{display:flex;gap:7px;overflow:auto;padding:4px 0 8px}.pill{white-space:nowrap;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 12px;color:var(--brown)}.pill.active{background:var(--brown);color:white}input,textarea,select{width:100%;border:1px solid #d8d0c5;border-radius:13px;padding:12px;background:white;font:inherit;margin:6px 0 10px}textarea{min-height:90px}.modal{position:fixed;z-index:60;inset:0;background:rgba(43,36,29,.38);display:flex;align-items:flex-end}.hidden{display:none}.sheet{width:min(720px,100%);max-height:88vh;overflow:auto;background:var(--cream);border-radius:28px 28px 0 0;padding:22px 18px calc(24px + env(safe-area-inset-bottom));margin:auto}.close{float:right;border:0;background:#e8dfd3;border-radius:50%;width:34px;height:34px;font-size:19px}.tag{display:inline-block;background:#efe7da;color:var(--brown);font-size:11px;padding:5px 8px;border-radius:999px;margin:2px}.meal h3{margin:0;color:var(--brown)}.empty{text-align:center;color:var(--muted);padding:28px 12px}@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div class="shell" id="app"></div><nav class="bottom"><button data-route="home" class="active">⌂<span>Home</span></button><button data-route="meals">🍽️<span>Meals</span></button><button data-route="plan">▦<span>Plan</span></button><button data-route="more">•••<span>More</span></button></nav><div id="modal" class="modal hidden"></div><script>
let state={meals:[],plan:{},cooldown:21};try{state={...state,...JSON.parse(localStorage.getItem("dinner-v1")||"{}")}}catch(e){}const save=()=>localStorage.setItem("dinner-v1",JSON.stringify(state));const $=s=>document.querySelector(s);
const samples=[["Tacos",25,"easy","beef","takeout-ish",["ground beef","tortillas","cheese","toppings"],"Brown the beef, season it, warm tortillas, and build."],["Sheet Pan Chicken & Veggies",35,"medium","chicken","sheet pan",["chicken breast","vegetables","olive oil","seasoning"],"Season everything and roast on one sheet pan until cooked through."],["Creamy Chicken Pasta",30,"medium","chicken","comfort",["chicken","pasta","cream sauce","parmesan"],"Cook pasta, sauté chicken, and combine with sauce."],["Breakfast for Dinner",20,"easy","whatever","comfort",["eggs","toast","breakfast meat"],"Make the easiest breakfast you want and call it dinner."],["Grilled Burgers",30,"medium","beef","grill",["burger patties","buns","cheese","toppings"],"Grill burgers and assemble."],["Crockpot Salsa Chicken",10,"easy","chicken","crockpot",["chicken","salsa","taco seasoning"],"Add to the slow cooker and cook until shreddable."]];
if(!state.meals.length){state.meals=samples.map((m,i)=>({id:Date.now()+i,name:m[0],time:m[1],effort:m[2],protein:m[3],type:m[4],ingredients:m[5],recipe:m[6],favorite:false,hideUntil:null}));save()}
function head(t,s=""){return `<div class="brand">Dinner</div><div class="kicker">Make one less decision</div><h1>${t}</h1>${s?`<div class="sub">${s}</div>`:""}`}
function card(m){return `<div class="card meal"><h3>${m.name}</h3><div><span class="tag">${m.time} min</span><span class="tag">${m.effort}</span><span class="tag">${m.protein}</span><span class="tag">${m.type}</span></div><div class="sub" style="margin-top:8px"><b>You’ll need:</b> ${m.ingredients.join(" · ")}</div><p>${m.recipe}</p><button class="btn secondary" onclick="fav(${m.id})">${m.favorite?"♥ Favorite":"♡ Favorite"}</button> <button class="btn secondary" onclick="made(${m.id})">Made it</button></div>`}
function available(){const n=Date.now();return state.meals.filter(m=>!m.hideUntil||new Date(m.hideUntil).getTime()<=n)}
function home(){const p=available()[0]||state.meals[0];return head("What are we eating?","Choose based on the amount of effort you actually have tonight.")+`<div class="hero"><div class="kicker">Tonight</div><h2>${p.name}</h2><p class="sub">${p.time} minutes · ${p.effort}</p><button class="btn primary" onclick="pick()">Pick something else</button></div><div class="section"><div class="grid"><button class="tile" onclick="pick('easy')"><span class="ico">🫠</span><strong>Absolutely not</strong><small>Give me the easiest thing.</small></button><button class="tile" onclick="pick('medium')"><span class="ico">🙂</span><strong>I can manage</strong><small>Reasonable effort is fine.</small></button><button class="tile" onclick="route('meals')"><span class="ico">♡</span><strong>Our Meals</strong><small>Your family meal library.</small></button><button class="tile" onclick="useHave()"><span class="ico">🥕</span><strong>Use What We Have</strong><small>Search by ingredient.</small></button></div></div>`}
function meals(){return head("Our Meals","The things you actually make and like.")+`<button class="btn primary wide" onclick="mealForm()">＋ Add a meal</button><div class="pills"><button class="pill active" onclick="filterMeals(this,'all')">All</button><button class="pill" onclick="filterMeals(this,'favorites')">Favorites</button><button class="pill" onclick="filterMeals(this,'easy')">Stupid easy</button><button class="pill" onclick="filterMeals(this,'crockpot')">Crockpot</button></div><div id="mealList">${state.meals.map(card).join("")}</div>`}
function plan(){const days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];return head("This Week","A light meal plan — not a food tracker.")+days.map(d=>`<div class="card"><b>${d}</b><select onchange="state.plan['${d}']=this.value;save()"><option value="">No meal planned</option>${state.meals.map(m=>`<option value="${m.id}" ${String(state.plan[d])===String(m.id)?"selected":""}>${m.name}</option>`).join("")}</select></div>`).join("")}
function more(){return head("More","Small tools, not more maintenance.")+`<div class="card"><h2>Cooldown</h2><p class="sub">When you tap “Made it,” Dinner can avoid suggesting it again for a while.</p><label>Days before suggesting again</label><input type="number" min="0" value="${state.cooldown}" onchange="state.cooldown=Number(this.value);save()"></div>`}
function render(){const r=location.hash.slice(1)||"home";$("#app").innerHTML=({home,meals,plan,more}[r]||home)();document.querySelectorAll(".bottom button").forEach(b=>b.classList.toggle("active",b.dataset.route===r));scrollTo(0,0)}function route(r){location.hash=r}
function show(h){$("#modal").innerHTML=`<div class="sheet"><button class="close" onclick="hide()">×</button>${h}</div>`;$("#modal").classList.remove("hidden")}function hide(){$("#modal").classList.add("hidden")}
function pick(e){let l=available().filter(m=>!e||m.effort===e);if(!l.length)l=available();const m=l[Math.floor(Math.random()*l.length)]||state.meals[0];show(`<div class="kicker">Tonight</div><h2>${m.name}</h2>${card(m)}<button class="btn primary wide" onclick="pick('${e||""}')">Pick again</button>`)}
function fav(id){const m=state.meals.find(x=>x.id===id);m.favorite=!m.favorite;save();render()}function made(id){const m=state.meals.find(x=>x.id===id),d=new Date();d.setDate(d.getDate()+state.cooldown);m.hideUntil=d.toISOString();save();show(`<h2>Got it.</h2><p>${m.name} won’t be suggested again until ${d.toLocaleDateString()}.</p>`)}
function mealForm(){show(`<h2>Add a meal</h2><label>Name</label><input id="n"><label>Minutes</label><input id="t" type="number" value="30"><label>Effort</label><select id="e"><option>easy</option><option>medium</option><option>cook</option></select><label>Protein</label><select id="p"><option>chicken</option><option>beef</option><option>pork</option><option>pasta</option><option>meatless</option><option>whatever</option></select><label>Type</label><select id="y"><option>comfort</option><option>light</option><option>takeout-ish</option><option>crockpot</option><option>grill</option><option>sheet pan</option><option>one pot</option></select><label>Ingredients (comma separated)</label><textarea id="i"></textarea><label>How to make it</label><textarea id="r"></textarea><button class="btn primary wide" onclick="saveMeal()">Save meal</button>`)}
function saveMeal(){const n=$("#n").value.trim();if(!n)return;state.meals.push({id:Date.now(),name:n,time:Number($("#t").value)||30,effort:$("#e").value,protein:$("#p").value,type:$("#y").value,ingredients:$("#i").value.split(",").map(x=>x.trim()).filter(Boolean),recipe:$("#r").value.trim(),favorite:false,hideUntil:null});save();hide();route("meals");render()}
function filterMeals(b,v){document.querySelectorAll(".pill").forEach(x=>x.classList.remove("active"));b.classList.add("active");let l=state.meals;if(v==="favorites")l=l.filter(x=>x.favorite);if(v==="easy")l=l.filter(x=>x.effort==="easy");if(v==="crockpot")l=l.filter(x=>x.type==="crockpot");$("#mealList").innerHTML=l.map(card).join("")||'<div class="empty">Nothing here yet.</div>'}
function useHave(){show(`<h2>Use What We Have</h2><input id="h" placeholder="chicken, tortillas"><button class="btn primary wide" onclick="searchHave()">Find meals</button><div id="res"></div>`)}function searchHave(){const q=$("#h").value.toLowerCase().split(",").map(x=>x.trim()).filter(Boolean);const l=state.meals.filter(m=>q.some(a=>m.ingredients.some(i=>i.toLowerCase().includes(a))));$("#res").innerHTML=l.map(card).join("")||'<div class="empty">No saved meals match yet.</div>'}
window.addEventListener("hashchange",render);document.querySelectorAll(".bottom button").forEach(b=>b.addEventListener("click",()=>route(b.dataset.route)));render();
</script></body></html>
