{id:"beefy-baked-ravioli",name:"Beefy Baked Ravioli",time:70,prep:10,cook:60,total:70,servings:"10",effort:"medium",protein:"beef",type:"comfort",ingredients:["25 ounces cheese ravioli, fresh or frozen","Olive oil or avocado oil","1/2 medium onion, diced","3 cloves garlic, minced","1 pound lean ground beef","1/2 pound pork sausage","2 24-ounce jars marinara sauce","2 cups shredded mozzarella cheese","2 cups shredded Italian blend cheese or additional mozzarella","Cooking spray","Grated Parmesan cheese, optional for serving"],instructions:["Preheat the oven to 375°F. Spray a 9×13-inch baking dish, or two 8×8-inch dishes, with cooking spray.","Heat a little oil in a large skillet over medium-high heat. Sauté the onion until soft, about 4 minutes. Add the garlic and cook for 1 minute without letting it burn.","Add the ground beef and pork sausage. Cook until browned and no longer pink, breaking the meat apart as it cooks. Drain the grease.","Stir the marinara sauce into the meat mixture, then remove from the heat.","Spread a thin layer of meat sauce on the bottom of the baking dish. Add half of the ravioli in a single layer. Top with about 1 cup mozzarella and 1 cup Italian blend cheese, then spread half of the remaining sauce over the cheese.","Repeat the layers with the remaining ravioli, cheeses, and sauce, ending with sauce on top.","Cover tightly with aluminum foil and bake for 45 minutes. Remove the foil and bake about 15 minutes more, until hot and bubbly around the edges.","Let rest for about 10 minutes before serving. Sprinkle with Parmesan if desired."],favorite:false,hideUntil:null},

function normalizeMeal(m,i=0){return {...m,id:m.id||("starter-"+i+"-"+String(m.name||"").toLowerCase().replace(/[^a-z0-9]+/g,"-")),instructions:m.instructions||(m.recipe?[m.recipe]:[]),recipe:m.recipe||"",servings:m.servings||"",prep:m.prep??null,cook:m.cook??null,total:m.total??m.time??null}}
state.deletedMealIds=Array.isArray(state.deletedMealIds)?state.deletedMealIds:[];
const isDeleted=id=>state.deletedMealIds.includes(String(id));
if(!state.meals.length){state.meals=[...samples,...starterExtras].map(normalizeMeal).filter(m=>!isDeleted(m.id));save()}else{
 state.meals=state.meals.map(normalizeMeal).filter(m=>!isDeleted(m.id));
 const names=new Set(state.meals.map(m=>m.name.toLowerCase()));
 samples.forEach(m=>{const nm=normalizeMeal(m);if(!isDeleted(nm.id)&&!names.has(nm.name.toLowerCase()))state.meals.push(nm)});
 save();
}

function safeId(id){return JSON.stringify(String(id))}
function card(m){const timing=[m.prep?`Prep ${m.prep} min`:"",m.cook?`Cook ${m.cook} min`:"",(m.total||m.time)?`Total ${m.total||m.time} min`:""].filter(Boolean).join(" · ");return `<div class="card meal"><h3>${m.name}</h3><div><span class="tag">${m.effort}</span><span class="tag">${m.protein}</span><span class="tag">${m.type}</span>${m.servings?`<span class="tag">${m.servings} servings</span>`:""}</div>${timing?`<div class="sub" style="margin-top:8px">${timing}</div>`:""}<button class="btn primary wide" style="margin-top:12px" onclick='recipeDetail(${safeId(m.id)})'>View recipe</button><div style="margin-top:8px"><button class="btn secondary" onclick='favById(${safeId(m.id)})'>${m.favorite?"♥ Favorite":"♡ Favorite"}</button> <button class="btn secondary" onclick='madeById(${safeId(m.id)})'>Made it</button></div></div>`}
function recipeDetail(id){const m=state.meals.find(x=>String(x.id)===String(id));if(!m)return;const timing=[m.servings?`${m.servings} servings`:"",m.prep?`Prep ${m.prep} min`:"",m.cook?`Cook ${m.cook} min`:"",(m.total||m.time)?`Total ${m.total||m.time} min`:""].filter(Boolean).join(" · ");const inst=(m.instructions||[]);const ing=(m.ingredients||[]);show(`<div class="kicker">Recipe</div><h2>${m.name}</h2>${timing?`<div class="sub">${timing}</div>`:""}${ing.length?`<h3 style="color:var(--brown);margin-top:22px">Ingredients</h3><ul style="padding-left:22px;line-height:1.55">${ing.map(i=>`<li>${i}</li>`).join("")}</ul>`:""}${inst.length?`<h3 style="color:var(--brown);margin-top:22px">Instructions</h3><ol style="padding-left:22px;line-height:1.55">${inst.map(i=>`<li style="margin-bottom:10px">${i}</li>`).join("")}</ol>`:""}<button class="btn secondary wide" style="margin-top:24px;color:#8b2f2f" onclick='confirmDeleteMeal(${safeId(m.id)})'>Delete recipe</button>`)}
function confirmDeleteMeal(id){const m=state.meals.find(x=>String(x.id)===String(id));if(!m)return;show(`<div class="kicker">Delete recipe</div><h2>${m.name}</h2><p class="sub">This removes it from your meal library and from any days where it is currently planned.</p><button class="btn primary wide" style="background:#8b2f2f" onclick='deleteMeal(${safeId(m.id)})'>Yes, delete it</button><button class="btn secondary wide" style="margin-top:10px" onclick='recipeDetail(${safeId(m.id)})'>Cancel</button>`)}
function deleteMeal(id){const sid=String(id);if(!state.deletedMealIds.includes(sid))state.deletedMealIds.push(sid);state.meals=state.meals.filter(m=>String(m.id)!==sid);Object.keys(state.plan||{}).forEach(d=>{if(String(state.plan[d])===sid)state.plan[d]=""});save();hide();route("meals");render()}
function favById(id){const m=state.meals.find(x=>String(x.id)===String(id));if(!m)return;m.favorite=!m.favorite;save();render()}
function madeById(id){const m=state.meals.find(x=>String(x.id)===String(id));if(!m)return;const d=new Date();d.setDate(d.getDate()+state.cooldown);m.hideUntil=d.toISOString();save();show(`<h2>Got it.</h2><p>${m.name} won’t be suggested again until ${d.toLocaleDateString()}.</p>`)}
function available(){const n=Date.now();return state.meals.filter(m=>!m.hideUntil||new Date(m.hideUntil).getTime()<=n)}
function home(){const p=available()[0]||state.meals[0];return head("What are we eating?","Choose based on the amount of effort you actually have tonight.")+`<div class="hero"><div class="kicker">Tonight</div><h2>${p.name}</h2><p class="sub">${p.time?`${p.time} minutes · `:""}${p.effort}</p><button class="btn primary" onclick="pick()">Pick something else</button></div><div class="section"><div class="grid"><button class="tile" onclick="pick('easy')"><span class="ico">🫠</span><strong>Absolutely not</strong><small>Give me the easiest thing.</small></button><button class="tile" onclick="pick('medium')"><span class="ico">🙂</span><strong>I can manage</strong><small>Reasonable effort is fine.</small></button><button class="tile" onclick="route('meals')"><span class="ico">♡</span><strong>Our Meals</strong><small>Your family meal library.</small></button><button class="tile" onclick="useHave()"><span class="ico">🥕</span><strong>Use What We Have</strong><small>Search by ingredient.</small></button></div></div>`}
function meals(){return head("Our Meals","The things you actually make and like.")+`<button class="btn primary wide" onclick="mealForm()">＋ Add a meal</button><div class="pills"><button class="pill active" onclick="filterMeals(this,'all')">All</button><button class="pill" onclick="filterMeals(this,'favorites')">Favorites</button><button class="pill" onclick="filterMeals(this,'easy')">Stupid easy</button><button class="pill" onclick="filterMeals(this,'crockpot')">Crockpot</button></div><div id="mealList">${state.meals.map(card).join("")}</div>`}
function plan(){const days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];return head("This Week","Choose meals and your grocery list updates automatically.")+days.map(d=>`<div class="card"><b>${d}</b><select onchange="state.plan['${d}']=this.value;save();"><option value="">No meal planned</option>${state.meals.map(m=>`<option value="${m.id}" ${String(state.plan[d])===String(m.id)?"selected":""}>${m.name}</option>`).join("")}</select></div>`).join("")+`<button class="btn primary wide" onclick="route('grocery')">🛒 View grocery list</button>`}
function ingredientParts(raw){
  if(raw&&typeof raw==="object") return {name:(raw.name||"").trim(),qty:raw.qty??"",unit:(raw.unit||"").trim(),display:raw.display||""};
  const t=String(raw||"").trim();
  const m=t.match(/^(\d+(?:\.\d+)?|\d+\s*\/\s*\d+|\d+\s+\d+\s*\/\s*\d+)?\s*(cups?|tbsp|tablespoons?|tsp|teaspoons?|oz|ounces?|lbs?|pounds?|g|kg|ml|l|cloves?|cans?|packages?|pkg|boxes?|bags?|bunch(?:es)?|heads?|slices?)?\s*(.*)$/i);
  return {qty:(m&&m[1]||"").trim(),unit:(m&&m[2]||"").trim(),name:(m&&m[3]||t).trim()||t,display:t};
}
function fracNum(v){v=String(v||"").trim();if(!v)return null;if(/^\d+(?:\.\d+)?$/.test(v))return Number(v);if(/^\d+\s*\/\s*\d+$/.test(v)){let[a,b]=v.split('/').map(Number);return b?a/b:null}if(/^\d+\s+\d+\s*\/\s*\d+$/.test(v)){let [w,f]=v.split(/\s+/,2),[a,b]=f.split('/').map(Number);return Number(w)+(b?a/b:0)}return null}
function niceQty(n){if(n==null)return"";const near=(a,b)=>Math.abs(n-a)<.03?b:null;return near(.25,"1/4")||near(.333,"1/3")||near(.5,"1/2")||near(.667,"2/3")||near(.75,"3/4")||(Math.round(n*100)/100).toString()}
function groceryKey(name,unit){return (name+"|"+unit).toLowerCase().replace(/[^a-z0-9|]+/g," ").trim()}
function groceryItems(){
  const picked=Object.values(state.plan||{}).map(id=>state.meals.find(m=>String(m.id)===String(id))).filter(Boolean);
  const map=new Map();
  picked.forEach(m=>(m.ingredients||[]).forEach(raw=>{const p=ingredientParts(raw);if(!p.name)return;const k=groceryKey(p.name,p.unit);const q=fracNum(p.qty);if(!map.has(k))map.set(k,{name:p.name,unit:p.unit,qty:q,rawQty:p.qty,count:1,meals:new Set([m.name])});else{const x=map.get(k);x.meals.add(m.name);x.count++;if(q!=null&&x.qty!=null)x.qty+=q;else{x.qty=null;x.rawQty=""}}}));
  const items=[...map.entries()].map(([key,x])=>({key,name:x.name,unit:x.unit,qty:x.qty,rawQty:x.rawQty,count:x.count,meals:[...x.meals]}));
  (state.groceryExtras||[]).forEach((name,i)=>items.push({key:"extra-"+i,name,unit:"",qty:null,rawQty:"",count:1,meals:["Extra"]}));
  return items.sort((a,b)=>a.name.localeCompare(b.name));
}
function groceryLabel(x){let q=x.qty!=null?niceQty(x.qty):x.rawQty;return `${q?`<b>${q}${x.unit?" "+x.unit:""}</b> `:""}${x.name}${!q&&x.count>1?` <span class="tag">×${x.count}</span>`:""}`}
function grocery(){const items=groceryItems();const planned=Object.values(state.plan||{}).filter(Boolean).length;return head("Grocery List",planned?`Built automatically from ${planned} planned meal${planned===1?"":"s"}. Check off what you already have or as you shop.`:"Plan meals first and their ingredients will appear here.")+`<div class="card"><div style="display:flex;gap:8px"><input id="gx" placeholder="Add milk, bananas, dog food…" style="margin:0"><button class="btn secondary" onclick="addExtra()">Add</button></div></div>`+(items.length?items.map(x=>`<div class="card" style="display:flex;gap:12px;align-items:flex-start;opacity:${state.groceryChecked[x.key]?.6:1}"><input type="checkbox" ${state.groceryChecked[x.key]?"checked":""} onchange="toggleGrocery('${x.key.replace(/'/g,"\\'")}')" style="width:22px;height:22px;margin:1px 0"><div style="flex:1"><div style="${state.groceryChecked[x.key]?"text-decoration:line-through":""}">${groceryLabel(x)}</div><div class="sub" style="margin-top:3px">${x.meals.join(" · ")}</div></div>${x.key.startsWith("extra-")?`<button class="close" onclick="removeExtra(${Number(x.key.split('-')[1])})">×</button>`:""}</div>`).join(""):`<div class="empty">No grocery items yet.</div>`)+`<button class="btn secondary wide" onclick="clearChecked()">Clear checked items</button>`}
function toggleGrocery(k){state.groceryChecked[k]=!state.groceryChecked[k];save();render()}
function addExtra(){const v=$("#gx").value.trim();if(!v)return;state.groceryExtras=state.groceryExtras||[];state.groceryExtras.push(v);save();render()}
function removeExtra(i){state.groceryExtras.splice(i,1);save();render()}
function clearChecked(){state.groceryChecked={};save();render()}
function more(){return head("More","Small tools, not more maintenance.")+`<div class="card"><h2>Cooldown</h2><p class="sub">When you tap “Made it,” Dinner can avoid suggesting it again for a while.</p><label>Days before suggesting again</label><input type="number" min="0" value="${state.cooldown}" onchange="state.cooldown=Number(this.value);save()"></div>`}
function render(){const r=location.hash.slice(1)||"home";$("#app").innerHTML=({home,meals,plan,grocery,more}[r]||home)();document.querySelectorAll(".bottom button").forEach(b=>b.classList.toggle("active",b.dataset.route===r));scrollTo(0,0)}function route(r){location.hash=r}
function show(h){$("#modal").innerHTML=`<div class="sheet"><button class="close" onclick="hide()">×</button>${h}</div>`;$("#modal").classList.remove("hidden")}function hide(){$("#modal").classList.add("hidden")}
function pick(e){let l=available().filter(m=>!e||m.effort===e);if(!l.length)l=available();const m=l[Math.floor(Math.random()*l.length)]||state.meals[0];show(`<div class="kicker">Tonight</div><h2>${m.name}</h2>${card(m)}<button class="btn primary wide" onclick="pick('${e||""}')">Pick again</button>`)}
function mealForm(){show(`<h2>Add a recipe</h2><p class="sub">Use the same format for every meal so recipes stay easy to scan and grocery lists stay accurate.</p><label>Recipe name</label><input id="n"><label>Servings</label><input id="sv" placeholder="6"><div class="grid"><div><label>Prep minutes</label><input id="pr" type="number" placeholder="10"></div><div><label>Cook minutes</label><input id="ck" type="number" placeholder="30"></div></div><label>Total minutes</label><input id="t" type="number" value="30"><label>Effort</label><select id="e"><option>easy</option><option>medium</option><option>cook</option></select><label>Protein</label><select id="p"><option>chicken</option><option>beef</option><option>pork</option><option>pasta</option><option>meatless</option><option>whatever</option></select><label>Type</label><select id="y"><option>comfort</option><option>light</option><option>takeout-ish</option><option>crockpot</option><option>grill</option><option>sheet pan</option><option>one pot</option></select><label>Ingredients</label><textarea id="i" placeholder="Put one ingredient per line, including quantity.&#10;1 lb ground beef&#10;1 24-ounce jar pasta sauce&#10;2 cups shredded mozzarella"></textarea><label>Instructions</label><textarea id="r" style="min-height:150px" placeholder="Put one step per line.&#10;Brown the ground beef and drain.&#10;Stir in the pasta sauce.&#10;Bake until bubbly."></textarea><button class="btn primary wide" onclick="saveMeal()">Save recipe</button>`)}
function saveMeal(){const n=$("#n").value.trim();if(!n)return;const prep=Number($("#pr").value)||null,cook=Number($("#ck").value)||null,total=Number($("#t").value)||(prep||0)+(cook||0)||30;state.meals.push({id:"user-"+Date.now(),name:n,servings:$("#sv").value.trim(),prep,cook,total,time:total,effort:$("#e").value,protein:$("#p").value,type:$("#y").value,ingredients:$("#i").value.split(/\n+/).map(x=>x.trim()).filter(Boolean),instructions:$("#r").value.split(/\n+/).map(x=>x.trim()).filter(Boolean),favorite:false,hideUntil:null});save();hide();route("meals");render()}
function filterMeals(b,v){document.querySelectorAll(".pill").forEach(x=>x.classList.remove("active"));b.classList.add("active");let l=state.meals;if(v==="favorites")l=l.filter(x=>x.favorite);if(v==="easy")l=l.filter(x=>x.effort==="easy");if(v==="crockpot")l=l.filter(x=>x.type==="crockpot");$("#mealList").innerHTML=l.map(card).join("")||'<div class="empty">Nothing here yet.</div>'}
function useHave(){show(`<h2>Use What We Have</h2><input id="h" placeholder="chicken, tortillas"><button class="btn primary wide" onclick="searchHave()">Find meals</button><div id="res"></div>`)}function searchHave(){const q=$("#h").value.toLowerCase().split(",").map(x=>x.trim()).filter(Boolean);const l=state.meals.filter(m=>q.some(a=>m.ingredients.some(i=>String(i).toLowerCase().includes(a))));$("#res").innerHTML=l.map(card).join("")||'<div class="empty">No saved meals match yet.</div>'}
window.addEventListener("hashchange",render);document.querySelectorAll(".bottom button").forEach(b=>b.addEventListener("click",()=>route(b.dataset.route)));render();
</script></body></html>
